<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RK3576 Assistant</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --line: #dfe3e8; --text: #1f2933; --muted: #6b7785;
    --accent: #2563eb; --accent-soft: #e8f0fe; --user: #eef2f7; --ok: #15803d; --warn: #b45309; --bad: #b91c1c;
    --mark: #fff3a3;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text);
         display: flex; flex-direction: column; }

  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap;
           align-items: center; gap: 10px 18px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  header h1 small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
  .chip { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .chip b { color: var(--text); font-weight: 600; }
  .chip.busy b { color: var(--warn); }
  #menuBtn { display: none; }

  .layout { flex: 1; min-height: 0; display: flex; }
  aside { width: 270px; flex: none; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 12px; }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  details { margin-bottom: 4px; }
  summary { cursor: pointer; padding: 4px 2px; font-weight: 600; font-size: 14px; }
  .doc { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 4px 8px 4px 18px; border-radius: 6px; cursor: pointer;
         font: inherit; font-size: 13.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doc:hover { background: var(--accent-soft); }
  .doc span { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .side-note { font-size: 12.5px; color: var(--muted); margin-top: 10px; }

  main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #chat { flex: 1; overflow-y: auto; padding: 18px 16px; }
  .col { max-width: 820px; margin: 0 auto; }
  .msg { margin-bottom: 16px; }
  .who { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 3px; letter-spacing: .03em; }
  .bubble { padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; }
  .msg.user .bubble { background: var(--user); }
  .msg.bot .bubble { background: var(--panel); border: 1px solid var(--line); }
  .msg.sys .bubble { background: transparent; border: 1px dashed var(--line); color: var(--muted); font-size: 14px; }
  .cursor::after { content: "▍"; color: var(--accent); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .sources { margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
  .sources .t { font-size: 12px; font-weight: 600; color: var(--muted); padding: 6px 12px; background: #fafbfc; border-bottom: 1px solid var(--line); }
  .src { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 7px 12px; cursor: pointer; font: inherit; font-size: 13.5px; color: var(--accent); }
  .src:last-child { border-bottom: 0; }
  .src:hover { background: var(--accent-soft); }
  .src .n { color: var(--muted); margin-right: 6px; }

  form { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px 14px; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; min-height: 42px; max-height: 160px; background: #fff; color: var(--text); }
  textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  button.btn { font: inherit; border: 1px solid var(--line); background: #fff; color: var(--text); padding: 9px 14px; border-radius: 10px; cursor: pointer; }
  button.btn:hover { background: var(--bg); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #1d4ed8; }
  button:disabled { opacity: .5; cursor: default; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; margin-top: 8px; font-size: 13.5px; color: var(--muted); }
  .opts label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .opts a { color: var(--accent); cursor: pointer; text-decoration: none; }

  /* viewer */
  #viewer { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  #viewer.open { display: flex; }
  .sheet { background: var(--panel); border-radius: 12px; width: min(900px, 100%); max-height: 100%; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .sheet header { border-radius: 12px 12px 0 0; }
  .sheet .path { font-weight: 600; word-break: break-all; }
  .sheet .sub { color: var(--muted); font-size: 13px; }
  #docText { margin: 0; padding: 14px 18px; overflow: auto; white-space: pre-wrap; word-wrap: break-word; font: 13.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  #docText mark { background: var(--mark); padding: 1px 0; border-radius: 3px; }

  @media (max-width: 760px) {
    aside { position: fixed; z-index: 5; top: 0; bottom: 0; left: 0; transform: translateX(-100%); transition: transform .2s; box-shadow: 2px 0 12px rgba(0,0,0,.15); padding-top: 56px; }
    aside.open { transform: none; }
    #menuBtn { display: inline-block; }
    .chips { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <button class="btn" id="menuBtn" type="button">Documents</button>
  <h1>RK3576 Assistant <small id="model"></small></h1>
  <div class="chips">
    <span class="chip" id="cState">State <b>…</b></span>
    <span class="chip" id="cNpu">NPU <b>–</b></span>
    <span class="chip" id="cCpu">CPU <b>–</b></span>
    <span class="chip" id="cRam">RAM <b>–</b></span>
    <span class="chip" id="cTemp">Temp <b>–</b></span>
  </div>
</header>

<div class="layout">
  <aside id="side">
    <h2>Documents</h2>
    <div id="docList">Loading…</div>
    <p class="side-note">Click a file to read it. Add files to the <code>docs</code> folder on the board, then press Re-index.</p>
    <button class="btn" type="button" id="reindex">Re-index documents</button>
    <p class="side-note" id="reindexMsg"></p>
  </aside>

  <main>
    <div id="chat"><div class="col" id="msgs"></div></div>
    <form id="form">
      <div class="col">
        <div class="row">
          <textarea id="q" rows="1" placeholder="Ask a question…  (Enter to send, Shift+Enter for a new line)" autofocus></textarea>
          <button class="btn primary" id="send" type="submit">Send</button>
          <button class="btn" id="stop" type="button" disabled>Stop</button>
        </div>
        <div class="opts">
          <label><input type="checkbox" id="useRag" checked> Answer from my documents</label>
          <a id="clear">Clear chat</a>
        </div>
      </div>
    </form>
  </main>
</div>

<div id="viewer">
  <div class="sheet">
    <header>
      <div>
        <div class="path" id="vPath"></div>
        <div class="sub" id="vSub"></div>
      </div>
      <div class="chips"><button class="btn" id="vClose" type="button">Close</button></div>
    </header>
    <pre id="docText"></pre>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const msgs = $('msgs'), chat = $('chat'), q = $('q');
let busy = false, stickBottom = true;

chat.addEventListener('scroll', () => { stickBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 60; });
function scrollDown() { if (stickBottom) chat.scrollTop = chat.scrollHeight; }

function addMsg(kind, who, text) {
  const m = document.createElement('div'); m.className = 'msg ' + kind;
  m.innerHTML = '<div class="who"></div><div class="bubble"></div>';
  m.querySelector('.who').textContent = who;
  m.querySelector('.bubble').textContent = text;
  msgs.appendChild(m); scrollDown();
  return m;
}

// ---- status
async function refreshStatus() {
  try {
    const s = await (await fetch('/api/status')).json();
    $('model').textContent = s.model ? '· ' + s.model : '';
    const set = (id, label, val, cls) => { const e = $(id); e.innerHTML = label + ' <b></b>'; e.querySelector('b').textContent = val; e.className = 'chip' + (cls ? ' ' + cls : ''); };
    set('cState', 'State', s.busy ? 'Answering…' : 'Idle', s.busy ? 'busy' : '');
    set('cNpu', 'NPU', s.npu.ok ? s.npu.pct + '%' : 'n/a');
    set('cCpu', 'CPU', s.cpu.ok ? s.cpu.pct + '%' : 'n/a');
    set('cRam', 'RAM', s.ram.ok ? (s.ram.used_mb / 1024).toFixed(1) + ' / ' + (s.ram.total_mb / 1024).toFixed(1) + ' GB' : 'n/a');
    set('cTemp', 'Temp', s.temp.ok ? s.temp.c.toFixed(0) + ' °C' : 'n/a');
    const rag = $('useRag');
    if (!s.rag.available || s.rag.chunks === 0) { rag.checked = false; rag.disabled = true; } else { rag.disabled = false; }
  } catch (e) {
    $('cState').innerHTML = 'State <b>offline</b>';
  }
}
setInterval(refreshStatus, 2000); refreshStatus();

// ---- documents list
async function loadDocs() {
  const box = $('docList');
  try {
    const d = await (await fetch('/api/docs')).json();
    if (!d.files.length) { box.textContent = 'No documents indexed yet.'; return; }
    const groups = {};
    d.files.forEach(f => { const i = f.path.indexOf('/'); const g = i < 0 ? '(top level)' : f.path.slice(0, i); (groups[g] = groups[g] || []).push(f); });
    box.innerHTML = '';
    Object.keys(groups).sort().forEach(g => {
      const det = document.createElement('details'); det.open = true;
      const sum = document.createElement('summary'); sum.textContent = g + ' (' + groups[g].length + ')'; det.appendChild(sum);
      groups[g].forEach(f => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'doc'; b.title = f.path;
        b.textContent = f.path.slice(f.path.indexOf('/') + 1); const sp = document.createElement('span'); sp.textContent = f.chunks + ' parts'; b.appendChild(sp);
        b.onclick = () => openDoc(f.path, null, '');
        det.appendChild(b);
      });
      box.appendChild(det);
    });
  } catch (e) { box.textContent = 'Could not load the list.'; }
}
loadDocs();

$('reindex').onclick = async () => {
  $('reindexMsg').textContent = 'Indexing…';
  try {
    const r = await fetch('/api/ingest', { method: 'POST' }); const j = await r.json();
    $('reindexMsg').textContent = j.error ? j.error : `+${j.added} new, ${j.updated} changed, ${j.removed} removed. ${j.files} files / ${j.chunks} parts.`;
    loadDocs(); refreshStatus();
  } catch (e) { $('reindexMsg').textContent = 'Failed.'; }
};
$('menuBtn').onclick = () => $('side').classList.toggle('open');

// ---- document viewer with highlighted passage
async function openDoc(path, passage, heading) {
  $('side').classList.remove('open');
  $('vPath').textContent = path;
  $('vSub').textContent = heading || '';
  const pre = $('docText'); pre.textContent = 'Loading…';
  $('viewer').classList.add('open');
  try {
    const r = await fetch('/api/doc?path=' + encodeURIComponent(path));
    if (!r.ok) { pre.textContent = 'Could not open this file.'; return; }
    const text = (await r.text()).replace(/\r/g, '');
    let start = -1, end = -1;
    if (passage) {
      const lines = passage.split('\n').map(s => s.trim()).filter(Boolean);
      if (lines.length) {
        start = text.indexOf(lines[0]);
        if (start >= 0) { const le = text.indexOf(lines[lines.length - 1], start); end = le >= 0 ? le + lines[lines.length - 1].length : start + lines[0].length; }
      }
    }
    pre.textContent = '';
    if (start >= 0) {
      pre.append(text.slice(0, start));
      const mk = document.createElement('mark'); mk.textContent = text.slice(start, end); pre.appendChild(mk);
      pre.append(text.slice(end));
      $('vSub').textContent = (heading ? heading + '  ·  ' : '') + 'the highlighted part was given to the model';
      mk.scrollIntoView({ block: 'center' });
    } else {
      pre.textContent = text; pre.scrollTop = 0;
    }
  } catch (e) { pre.textContent = 'Could not open this file.'; }
}
$('vClose').onclick = () => $('viewer').classList.remove('open');
$('viewer').addEventListener('click', (e) => { if (e.target.id === 'viewer') $('viewer').classList.remove('open'); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('viewer').classList.remove('open'); });

// ---- asking
function setBusy(b) { busy = b; $('send').disabled = b; $('stop').disabled = !b; }

async function ask(question) {
  setBusy(true);
  addMsg('user', 'YOU', question);
  const bot = addMsg('bot', 'ASSISTANT', ''); const bubble = bot.querySelector('.bubble'); bubble.classList.add('cursor');
  let tokens = 0, t0 = performance.now(), tFirst = 0, sources = null, gotAny = false;
  const finish = (note) => {
    bubble.classList.remove('cursor');
    const secs = tFirst ? (performance.now() - tFirst) / 1000 : 0;
    const meta = document.createElement('div'); meta.className = 'meta';
    meta.textContent = (note ? note + ' · ' : '') + (tokens > 1 && secs > 0.2 ? `${tokens} tokens · ${((tokens - 1) / secs).toFixed(1)} tokens/s` : '');
    if (meta.textContent) bot.appendChild(meta);
    if (sources && sources.length) {
      const box = document.createElement('div'); box.className = 'sources';
      box.innerHTML = '<div class="t">SOURCES · click to open the file</div>';
      sources.forEach(s => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'src';
        b.innerHTML = '<span class="n"></span><span class="l"></span>';
        b.querySelector('.n').textContent = '[' + s.n + ']';
        b.querySelector('.l').textContent = s.path + (s.heading ? '  ›  ' + s.heading : '');
        b.onclick = () => openDoc(s.path, s.text, s.heading);
        box.appendChild(b);
      });
      bot.appendChild(box);
    }
    scrollDown();
  };
  try {
    const resp = await fetch('/api/ask?rag=' + ($('useRag').checked ? 1 : 0), { method: 'POST', body: question });
    if (!resp.ok) {
      let msg = 'Error ' + resp.status; try { msg = (await resp.json()).error || msg; } catch (e) {}
      bubble.classList.remove('cursor'); bot.className = 'msg sys'; bot.querySelector('.who').textContent = 'SYSTEM'; bubble.textContent = msg;
      return;
    }
    const reader = resp.body.getReader(); const dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        let ev = 'message', data = '';
        block.split('\n').forEach(l => { if (l.startsWith('event: ')) ev = l.slice(7); else if (l.startsWith('data: ')) data += l.slice(6); });
        if (!data) continue;
        const v = JSON.parse(data);
        if (ev === 'sources') sources = v;
        else if (ev === 'token') { if (!tFirst) tFirst = performance.now(); tokens++; gotAny = true; bubble.textContent += v; scrollDown(); }
        else if (ev === 'nodocs') { bot.className = 'msg sys'; bot.querySelector('.who').textContent = 'SYSTEM'; bubble.textContent = 'No relevant documents were found for this question. Try other keywords, add files and press Re-index, or untick “Answer from my documents”.'; }
        else if (ev === 'done') {
          if (v.status === 'error') bubble.textContent += (gotAny ? '\n\n' : '') + '[error: ' + (v.error || 'unknown') + ']';
          finish(v.status === 'aborted' ? 'stopped' : '');
          return;
        }
      }
    }
    finish('');
  } catch (e) {
    bubble.classList.remove('cursor'); bubble.textContent += '\n[connection lost]';
  } finally { setBusy(false); refreshStatus(); q.focus(); }
}

$('form').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = q.value.trim(); if (!text || busy) return;
  q.value = ''; q.style.height = 'auto'; stickBottom = true; ask(text);
});
q.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('form').requestSubmit(); } });
q.addEventListener('input', () => { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 160) + 'px'; });
$('stop').onclick = () => fetch('/api/stop', { method: 'POST' });
$('clear').onclick = async () => {
  if (busy) return;
  msgs.innerHTML = '';
  try { await fetch('/api/clear', { method: 'POST' }); } catch (e) {}
  addMsg('sys', 'SYSTEM', 'Chat cleared. The model memory was reset.');
};
addMsg('sys', 'SYSTEM', 'Ready. Ask a question. With “Answer from my documents” ticked, the answer comes with the files it used.');
</script>
</body>
</html>
